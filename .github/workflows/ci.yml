# ==============================================================================
# ImpactLens AI — CI
#
# Verifies the exact build that Render and Vercel will run, on every push and
# pull request, so a break is caught here instead of in a deploy log.
#
# Deliberately runs with NO secrets: the backend is verified against the same
# SQLite fallback it uses in local dev, so no database is required.
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # render.yaml deliberately does NOT pin pythonVersion, because Render
    # rejects builds pinned to a patch it does not stock and its current
    # default could not be verified. Instead of guessing one version, this
    # matrix verifies every 3.x that Render could plausibly default to, so
    # whichever it picks is already CI-proven.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # SQLAlchemy's postgresql:// default driver (psycopg 3) must be present,
      # or the engine raises ModuleNotFoundError before it can fall back.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the app imports and all routes register
        run: |
          python -c "
          from app.main import app
          # Count via the OpenAPI schema, not app.routes: this FastAPI version
          # wraps include_router() results in _IncludedRouter objects that carry
          # no .path, so walking app.routes reports ~6 paths instead of the
          # real surface.
          paths = sorted(app.openapi()['paths'])
          assert len(paths) >= 45, f'expected the full API surface, got {len(paths)} paths'
          for required in ['/health', '/api/media', '/api/projects', '/api/reports', '/api/voice/session']:
              assert required in paths, f'missing expected route: {required}'
          print(f'OK: {len(paths)} paths registered')
          "

      - name: Start the API and probe /health
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/projects | grep -q 'prj-'

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # Placeholder so the build never inlines a real localhost URL into the
        # bundle. In production Vercel injects the real value at build time.
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.invalid
        run: npm run build
